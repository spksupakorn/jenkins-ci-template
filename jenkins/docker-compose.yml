services:
  jenkins:
    build: .
    image: local/jenkins-docker:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # ให้ user jenkins ใน container เข้าถึง docker.sock ได้
    # สร้าง .env ด้วย shell (compose ไม่รัน $(...) ใน .env) ใช้ได้ทั้ง Linux และ Docker Desktop:
    #   echo "DOCKER_GID=$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock alpine stat -c %g /var/run/docker.sock)" > .env
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Bangkok

volumes:
  jenkins_home:
